version: "3.9"

services:
  api:
    build: .
    image: ts-foundation-model:latest
    container_name: ts-foundation-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_CKPT=/app/artifacts/finetune/best.pt
    volumes:
      - ./artifacts:/app/artifacts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.7.1
    container_name: ts-foundation-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --backend-store-uri /mlruns
      --default-artifact-root /mlruns
      --host 0.0.0.0
      --port 5000
    profiles: ["dev"]
