# finetune config (forecasting)
seed: 42

data:
  context_length: 256
  patch_len: 16
  stride: 16
  horizon: 24
  dataset: m4_mini
  m4_subset:
    - Hourly
    - Daily
  max_series: 200

model:
  d_model: 128
  n_heads: 4
  n_layers: 4
  ffn_dim: 256
  dropout: 0.1

finetune:
  pretrained_ckpt: artifacts/pretrain/best.pt
  freeze_encoder: false
  batch_size: 32
  lr: 3.0e-5
  weight_decay: 1.0e-5
  epochs: 30
  early_stopping_patience: 5
  ckpt_dir: artifacts/finetune

eval:
  metrics:
    - mase
    - smape
  m4_seasonality:
    Hourly: 24
    Daily: 1

logging:
  mlflow_experiment: ts-foundation-finetune
  log_every: 25
